name: nexfit
description: "NexFit - A premium fitness companion. Offline-first, Bangla-first health, workout and diet tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Local database (offline first)
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6

  # Authentication
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0

  # Google Drive backup
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  # Biometric app lock & device unlock
  local_auth: ^2.3.0

  # Open external links (support, rate app)
  url_launcher: ^6.3.1

  # Material 3 dynamic color (Android 12+)
  dynamic_color: ^1.7.0

  # SHA-256 hashing for the app-lock PIN
  crypto: ^3.0.6

  # AES-256-GCM encryption for Google Drive backups
  pointycastle: ^4.0.0

  # Connectivity (offline detection)
  connectivity_plus: ^7.3.1

  # Charts (weight / measurement trends)
  fl_chart: ^1.2.0

  # UI / Design system
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0

  # Utilities
  intl: 0.20.2
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  logging: ^1.3.0
  device_info_plus: ^13.2.0
  http: ^1.6.0
  _discoveryapis_commons: ^1.0.7
  sqflite_common_ffi_web: ^1.1.2
  sqflite_common: ^2.5.11
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

  # Local notifications (hydration reminders)
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.0.1
  pdf: ^3.12.0
  csv: ^8.0.0
  share_plus: ^13.3.0
  archive: ^4.0.9
  battery_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: bn

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/NextFit.png"
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/images/NextFit.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#0B0F14"
  image: assets/images/splash_logo.png
  android: true
  ios: true
